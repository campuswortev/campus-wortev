<title>Campus Wortev · Gestión</title>

<style>
:root{--bg:#FFF8F2;--sf:#FFFFFF;--tx:#072033;--mu:#5C6770;--ac:#2A5135;--ac2:#F5E2D1;--bd:#E6D8C7;--wr:#9A4A1A;--bad:#B3261E;--hd:#2A5135;--sand:#AC9A84;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:14.5px/1.5 "Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:30}
header{background:var(--hd);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.hi{max-width:980px;margin:auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px 24px;flex-wrap:wrap}
.lg{height:46px;width:auto;display:block}
h3{margin:0 0 10px;font-size:15px}
nav{display:flex;gap:2px;flex-wrap:wrap;max-width:100%}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:#fff;padding:8px 10px;font:inherit;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
nav button.on{border-bottom-color:#F5E2D1;font-weight:600}
.sub{max-width:980px;margin:auto;padding:8px 16px 0}
main{max-width:980px;margin:auto;padding:8px 16px 40px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:14px;margin:10px 0;box-shadow:0 1px 3px rgba(7,32,51,.07)}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.g4 .card{margin:0}.k span{display:block;color:var(--mu);font-size:13px}.k b{font-size:26px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:4px 0}
.mu{color:var(--mu)}.s{font-size:13px}
.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
input,select,textarea{font:inherit;padding:8px;border:1px solid var(--sand);border-radius:4px;background:#fff;color:var(--tx);min-width:0}
.btn{background:linear-gradient(135deg,#356643,#2A5135);color:#fff;border:0;border-radius:3px;padding:10px 16px;font:inherit;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;cursor:pointer}
.b2{background:#fff;border:1px solid var(--sand);color:var(--tx);border-radius:8px;padding:3px 9px;font:inherit;font-size:13px;cursor:pointer;margin-left:4px}
.pill{background:var(--ac2);color:var(--ac);border-radius:99px;padding:1px 10px;font-size:12px}
.pill.warn{color:var(--wr)}.pill.bad{color:var(--bad)}
.tag{font-size:12px;color:var(--wr)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.grid .card{margin:0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:99px;display:none}
.cal{display:grid;grid-template-columns:44px repeat(7,minmax(92px,1fr));min-width:700px;font-size:12px}
.ch{text-align:center;padding:4px;color:var(--mu);font-weight:600}.ch.td{color:var(--ac)}
.hh div{color:var(--mu);box-sizing:border-box;border-top:1px solid var(--bd)}
.cc{position:relative;border-left:1px solid var(--bd);background:repeating-linear-gradient(var(--bd) 0 1px,transparent 1px 30px)}.cc.td{background-color:var(--ac2)}
.bk{position:absolute;left:2px;right:2px;background:var(--ac);color:var(--bg);border-radius:6px;padding:2px 4px;overflow:hidden;line-height:1.25}
.x{float:right;background:none;border:0;color:inherit;cursor:pointer;font-size:14px;padding:0 2px}
.ni{flex:1;min-width:150px;font-size:13px;padding:4px 8px}
footer{text-align:center;color:var(--mu);font-size:12px;padding:10px}
.rt{width:100%;border-collapse:collapse;font-size:12.5px}.rt th,.rt td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}.rt th{cursor:pointer;position:sticky;top:0;background:var(--sf)}.rt .n{text-align:right}.rt tbody tr:nth-child(even){background:#FFFBF7}.rt tbody tr:hover{background:var(--ac2)}.rt tfoot td{font-weight:700;border-top:2px solid var(--bd)}.dh{margin:20px 0 6px;font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ac)}.rv{background:#fff;border:1px solid var(--bd);border-left:5px solid var(--ac);border-radius:8px;padding:12px 16px;margin:10px 0;display:grid;gap:5px;box-shadow:0 1px 3px rgba(7,32,51,.07)}.rv:hover{background:#FFFBF7}.rv1{display:flex;gap:4px 12px;align-items:baseline;flex-wrap:wrap}.rv1 .tm{font-size:15px;color:var(--ac)}.rv4{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;padding-top:9px;border-top:1px dashed var(--bd)}.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:2px 12px;margin-top:4px}.pg .rv{margin:6px 0}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script></head><body>
